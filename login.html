<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login - Facturación</title>
    <script>
        (function () {
            try {
                var savedMode = localStorage.getItem('darkMode');
                var useDark = savedMode === '1' || savedMode === 'true';
                if (savedMode === null && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    useDark = true;
                }
                document.documentElement.classList.toggle('dark-mode', !!useDark);
            } catch (_) {}
        })();
    </script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23059669'/><text y='70' font-size='60' fill='white' text-anchor='middle' x='50' font-weight='800'>$</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/app.css">
    <link rel="stylesheet" href="assets/css/tailwind.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/js/core/supabase-config.js"></script>
    <script src="assets/js/core/password-utils.js"></script>
    <script src="assets/js/core/loading-utils.js"></script>
    <script src="assets/js/core/supabase-utils.js"></script>
    <script src="assets/js/core/theme-utils.js"></script>
    <script src="assets/js/core/session-utils.js"></script>
    <script src="assets/js/core/toast-utils.js"></script>
    <script src="assets/js/core/status-utils.js"></script>
    <script src="assets/js/core/list-utils.js"></script>
    <script src="assets/js/core/html-utils.js"></script>
    <script src="assets/js/core/performance-utils.js"></script>
    <script src="assets/js/core/sw-register.js"></script>

    <!-- Supabase SDK (cliente ESM via CDN) -->
    <script type="module" src="assets/js/core/supabase-client.js"></script>
</head>
<body class="page-login">
    <div id="appLoading" class="app-loading-overlay">
        <div class="app-loading-card">
            <div class="app-spinner"></div>
            <div class="app-loading-text">Cargando...</div>
        </div>
    </div>

    <div class="theme-switch-floating">
        <button class="theme-switch" role="switch" aria-checked="false" onclick="toggleDarkMode()" title="Alternar modo oscuro" aria-label="Alternar modo oscuro">
            <span class="theme-switch-knob">
                <svg class="knob-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                <svg class="knob-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            </span>
        </button>
    </div>

    <main>
        <div class="login-card">
            <div class="login-brand">$</div>
            <h1 class="login-title">Iniciar sesión</h1>
            <p class="login-muted">Usa el administrador o ingresa tu usuario</p>

            <form id="loginForm" class="mt-6 space-y-4">
                <div>
                    <label class="login-label">Email</label>
                    <input id="email" type="email" required class="login-input" placeholder="admin@admin.com" />
                </div>
                <div>
                    <label class="login-label">Contraseña</label>
                    <div class="password-toggle-wrapper">
                        <input id="password" type="password" required class="login-input password-input-with-toggle" placeholder="••••••" />
                        <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('password')" title="Mostrar/ocultar contraseña">
                            <svg id="password-eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>
                <div id="errorMessage" class="hidden text-red-600 text-sm"></div>
                <div class="pt-1">
                    <button id="submitBtn" type="submit" class="login-submit">
                        <span id="btnText">Entrar</span>
                        <span id="btnLoading" class="hidden">Verificando...</span>
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script src="assets/js/login/config.js"></script>
    <script src="assets/js/login/auth.js"></script>
</body>
</html>
