<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin - Usuarios</title>
    <script>
        (function () {
            try {
                var savedMode = localStorage.getItem('darkMode');
                var useDark = savedMode === '1' || savedMode === 'true';
                if (savedMode === null && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    useDark = true;
                }
                document.documentElement.classList.toggle('dark-mode', !!useDark);
            } catch (_) {}
        })();
    </script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%2322c55e' width='100' height='100' rx='20'/><text y='70' font-size='60' fill='white' text-anchor='middle' x='50' font-weight='bold'>$</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/app.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/js/core/supabase-config.js"></script>
    <script src="assets/js/core/password-utils.js"></script>
    <script src="assets/js/core/loading-utils.js"></script>
    <script src="assets/js/core/supabase-utils.js"></script>
    <script src="assets/js/core/theme-utils.js"></script>
    <script src="assets/js/core/session-utils.js"></script>
    <script src="assets/js/core/toast-utils.js"></script>
    <script src="assets/js/core/status-utils.js"></script>
    <script src="assets/js/core/list-utils.js"></script>
    <script src="assets/js/core/performance-utils.js"></script>
    <script src="assets/js/core/sw-register.js"></script>
    <script src="assets/js/core/security.js"></script>

    <!-- Supabase SDK (cliente ESM via CDN) -->
    <script type="module" src="assets/js/core/supabase-client.js"></script>
</head>
<body class="page-admin">
    <div id="appLoading" class="app-loading-overlay">
        <div class="app-loading-card">
            <div class="app-spinner"></div>
            <div class="app-loading-text">Cargando...</div>
        </div>
    </div>

    <!-- Navbar -->
    <nav class="admin-nav">
        <div class="nav-actions">
            <a class="nav-brand" href="/" aria-label="Inicio">
                <span class="nav-brand-mark">$</span>
                <span class="nav-title">Administración</span>
            </a>
            <button onclick="window.location.href='/'" class="back-invoices-btn">Volver a Facturas</button>
        </div>
        <div class="nav-right-group">
            <span id="currentUserEmail"></span>
            <button class="theme-switch" role="switch" aria-checked="false" onclick="toggleDarkMode()" title="Alternar modo oscuro" aria-label="Alternar modo oscuro">
                <span class="theme-switch-knob">
                    <svg class="knob-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                    <svg class="knob-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </span>
            </button>
            <button onclick="logout()" class="nav-link-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                Logout
            </button>
        </div>
    </nav>

    <main class="page-main">
        <div class="admin-panel-card">
            <div class="admin-header">
                <div>
                    <h1 class="admin-panel-title">Panel de Administración</h1>
                    <p class="admin-panel-subtitle">Gestiona usuarios, exporta/importa y revisa acciones del administrador.</p>
                </div>
                <div class="admin-toolbar">
                    <div class="admin-search-bar">
                        <input id="userSearch" type="text" placeholder="Buscar por email" class="admin-search-input" />
                        <select id="pageSize" class="admin-page-size">
                            <option value="5">5</option>
                            <option value="10" selected>10</option>
                            <option value="20">20</option>
                        </select>
                    </div>
                    <button id="exportBtn" class="soft-btn">Exportar JSON</button>
                    <input id="importFile" type="file" accept="application/json" class="hidden" />
                    <button id="importBtn" class="soft-btn">Importar JSON</button>
                </div>
            </div>

            <form id="userForm" class="grid grid-cols-12 gap-3 items-end">
                <div class="col-span-12 md:col-span-4">
                    <label class="admin-form-label">Email</label>
                    <input id="uemail" type="email" required />
                </div>
                <div class="col-span-12 md:col-span-4">
                    <label class="admin-form-label">Contraseña</label>
                    <div class="admin-password-wrap">
                        <input id="upass" type="password" class="admin-password-input" required />
                        <button type="button" class="admin-password-toggle" onclick="togglePasswordVisibility('upass')" title="Mostrar/ocultar contraseña">
                            <svg id="upass-eye-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>
                <div class="col-span-12 sm:col-span-6 md:col-span-2">
                    <label class="admin-form-label">Rol</label>
                    <select id="urole">
                        <option value="user">Usuario</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>
                <div class="col-span-12 sm:col-span-6 md:col-span-2">
                    <button type="submit" class="admin-create-btn">Crear usuario</button>
                </div>
            </form>

            <h2 class="admin-section-title">Usuarios existentes</h2>
            <div class="admin-table-wrapper">
                <table class="users-table">
                    <thead>
                        <tr>
                            <th class="col-index">#</th>
                            <th>Email</th>
                            <th>Rol</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="usersBody"></tbody>
                </table>
            </div>

            <div class="admin-footer">
                <div class="nav-actions">
                    <button id="prevPage" class="soft-btn">Anterior</button>
                    <button id="nextPage" class="soft-btn">Siguiente</button>
                </div>
                <div class="admin-page-meta">Página <span id="currentPage">1</span></div>
            </div>
        </div>
    </main>

    <script src="assets/js/admin/main.js?v=20260301d"></script>
    <script>
        setTimeout(function () {
            var overlay = document.getElementById('appLoading');
            if (!overlay) return;
            overlay.classList.add('app-loading-hidden');
        }, 12000);
    </script>
</body>
</html>
